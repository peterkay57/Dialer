# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# NOTE: Reduced from -Xmx4g which caused the JVM to be OOM-killed on machines
# with ~2GB RAM (the Gradle daemon crashed mid-build). These conservative
# settings let low-memory CI runners / laptops complete the build.
org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -Xss512k -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# ✅ REQUIRED: Enable AndroidX to fix the dependency resolution crash
android.useAndroidX=true

org.gradle.caching=true

# ❌ DISABLED: Configuration cache is crashing due to a known AGP bug.
# We turn it off so the build can actually complete successfully.
org.gradle.configuration-cache=false

# Limit workers to reduce peak memory usage during the build
org.gradle.workers.max=2
org.gradle.daemon=false

# Run the Kotlin compiler out-of-process so it gets its own bounded JVM
# instead of consuming the Gradle daemon's heap (prevents OOM crashes).
kotlin.compiler.execution.strategy=out-of-process
kotlin.daemon.jvmargs=-Xmx768m

# Allow the google-services plugin to work even if the google-services.json is not present.
googleServices.missing.passthrough=true
